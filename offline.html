<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오프라인 | 내 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101a28; color: #ecf4ff; }
    main { max-width: 520px; padding: 24px; }
    p { line-height: 1.7; color: #bfd0e5; }
  </style>
</head>
<body>
  <main>
    <h1>연결되어 있지 않습니다</h1>
    <p>내 자료실은 네트워크 연결과 서버의 기기 승인 확인이 있어야 열립니다. 보호 자료는 이 기기에 저장하지 않으므로 오프라인에서는 표시되지 않습니다.</p>
    <p>연결이 돌아오면 이 화면을 새로고침하세요.</p>
  </main>
</body>
</html>
